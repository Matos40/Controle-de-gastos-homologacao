name: Smart AI Cloud Run candidate (isolated)
on:
  push:
    branches: [feature/smart-ai-server-v350-poc]
    paths:
      - 'experiments/smart-ai-server/cloud-run/**'
      - 'experiments/smart-ai-server/legacy/**'
      - 'experiments/smart-ai-server/remote/**'
      - 'experiments/smart-ai-server/firestore.mjs'
      - 'experiments/smart-ai-server/gemini.mjs'
      - '.github/workflows/smart-ai-cloud-run-candidate.yml'
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test experiments/smart-ai-server/cloud-run/integration/private-diagnostic.test.mjs experiments/smart-ai-server/cloud-run/integration/bridge-runtime.test.mjs experiments/smart-ai-server/cloud-run/integration/integration.test.mjs experiments/smart-ai-server/cloud-run/commercial.test.mjs experiments/smart-ai-server/cloud-run/invoice-contract.test.mjs experiments/smart-ai-server/cloud-run/infra/infra.test.mjs experiments/smart-ai-server/cloud-run/infra/operations.test.mjs experiments/smart-ai-server/remote/worker.test.mjs experiments/smart-ai-server/legacy/invoice.test.mjs
      - run: node --test experiments/smart-ai-server/cloud-run/integration/diagnostic-runtime.test.mjs
      - run: node --test experiments/smart-ai-server/cloud-run/bridge-runtime/trial-readiness.test.mjs experiments/smart-ai-server/cloud-run/bridge-runtime/trial-control-channel.test.mjs experiments/smart-ai-server/cloud-run/bridge-runtime/trial-control-runtime.test.mjs experiments/smart-ai-server/cloud-run/bridge-runtime/trial-execution-approval.test.mjs experiments/smart-ai-server/cloud-run/bridge-runtime/trial-controller-lifecycle.test.mjs
      - name: Verify private trial control using Firestore Emulator only
        timeout-minutes: 5
        env:
          GCLOUD_PROJECT: demo-raytech-v340
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
        run: |
          npx --yes firebase-tools@14.25.1 emulators:exec --only firestore --project demo-raytech-v340 --config experiments/smart-ai-server/firebase.json \
            'node experiments/smart-ai-server/cloud-run/bridge-runtime/trial-control-emulator.mjs'
      - name: Obtain the pinned V34.7.4.5 reference
        run: |
          git init "$RUNNER_TEMP/raytech-reference"
          git -C "$RUNNER_TEMP/raytech-reference" fetch --depth=1 https://github.com/Matos40/Controle-de-gastos-2.0.git 121cca799aa7072094c668697249214b899e86d5
          test "$(git -C "$RUNNER_TEMP/raytech-reference" rev-parse FETCH_HEAD)" = 121cca799aa7072094c668697249214b899e86d5
          git -C "$RUNNER_TEMP/raytech-reference" checkout --detach FETCH_HEAD
      - name: Prepare verified local UI dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/raytech-app-vendor"
          checks="$GITHUB_WORKSPACE/experiments/smart-ai-server/cloud-run/integration/vendor.sha256"
          cd "$RUNNER_TEMP/raytech-app-vendor"
          while read -r hash file; do
            curl -fsSL --retry 2 -o "$file" "https://raw.githubusercontent.com/Matos40/Controle-de-gastos-2.0/121cca799aa7072094c668697249214b899e86d5/vendor/$file"
          done < "$checks"
          sha256sum -c "$checks"
      - name: Test synthetic Smart AI UX in desktop and mobile engines
        timeout-minutes: 5
        run: |
          docker run --rm --ipc=host --volume "$GITHUB_WORKSPACE:/work:ro" --volume "$RUNNER_TEMP/raytech-app-vendor:/vendor:ro" --env RAYTECH_APP_VENDOR=/vendor --volume "$RUNNER_TEMP/raytech-reference:/official:ro" --env RAYTECH_OFFICIAL_SNAPSHOT=/official --workdir /work \
            mcr.microsoft.com/playwright:v1.56.1-noble bash -euc '
              npm install --no-save --package-lock=false --prefix /tmp/raytech-ux playwright@1.56.1
              export PLAYWRIGHT_MODULE=/tmp/raytech-ux/node_modules/playwright/index.mjs
              node --test --test-timeout=65000 experiments/smart-ai-server/cloud-run/ux/smart-ai.browser.test.mjs experiments/smart-ai-server/cloud-run/integration/integration.browser.test.mjs
            '
      - run: docker build -f experiments/smart-ai-server/cloud-run/Dockerfile -t smart-ai-candidate .
      - name: Build and verify disabled bridge without external network
        run: |
          docker build -f experiments/smart-ai-server/cloud-run/bridge-runtime/Dockerfile -t smart-ai-bridge-candidate .
          container=$(docker run --detach --network none smart-ai-bridge-candidate)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          for attempt in 1 2 3 4 5; do
            if docker exec "$container" node -e "
              fetch('http://127.0.0.1:8080/v1/credits')
                .then(response => { if (response.status !== 503) throw Error('credits unexpectedly enabled'); })
                .then(() => fetch('http://127.0.0.1:8080/internal/smart-ai/diagnostic'))
                .then(response => { if (response.status !== 503) process.exitCode = 1; })
                .catch(() => { process.exitCode = 1; });"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - name: Verify disabled container without external network
        run: |
          container=$(docker run --detach --network none smart-ai-candidate)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          for attempt in 1 2 3 4 5; do
            if docker exec "$container" node -e "
              fetch('http://127.0.0.1:8080/v1/invoices', {method: 'POST'})
                .then(response => { if (response.status !== 503) throw Error('invoices unexpectedly enabled'); })
                .then(() => fetch('http://127.0.0.1:8080/internal/smart-ai/diagnostic'))
                .then(response => { if (response.status !== 503) process.exitCode = 1; })
                .catch(() => { process.exitCode = 1; });"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - name: Verify disabled gateway without external network
        run: |
          container=$(docker run --detach --network none smart-ai-candidate node /app/experiments/smart-ai-server/cloud-run/gateway.mjs)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          for attempt in 1 2 3 4 5; do
            if docker exec "$container" node -e "
              fetch('http://127.0.0.1:8080/internal/smart-ai/diagnostic')
                .then(response => { if (response.status !== 503) process.exitCode = 1; })
                .catch(() => { process.exitCode = 1; });"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - name: Export the tested container for isolated delivery
        run: |
          docker save smart-ai-candidate | gzip -n > smart-ai-candidate.tar.gz
          sha256sum smart-ai-candidate.tar.gz > smart-ai-candidate.tar.gz.sha256
          digest=$(tar -xOf smart-ai-candidate.tar.gz index.json | jq -er '.manifests | select(length == 1) | .[0].digest')
          test "$digest" = "sha256:$(tar -xOf smart-ai-candidate.tar.gz "blobs/sha256/${digest#sha256:}" | sha256sum | cut -d ' ' -f 1)"
          printf '%s\n' "$digest" > smart-ai-candidate.oci-digest
      - uses: actions/upload-artifact@v4
        with:
          name: smart-ai-candidate-${{ github.sha }}
          path: |
            smart-ai-candidate.tar.gz
            smart-ai-candidate.tar.gz.sha256
            smart-ai-candidate.oci-digest
          if-no-files-found: error
          retention-days: 3

      - name: Archive verified bridge image
        run: |
          docker save smart-ai-bridge-candidate | gzip -n > smart-ai-bridge-candidate.tar.gz
          sha256sum smart-ai-bridge-candidate.tar.gz > smart-ai-bridge-candidate.tar.gz.sha256
          digest=$(tar -xOf smart-ai-bridge-candidate.tar.gz index.json | jq -er '.manifests | select(length == 1) | .[0].digest')
          test "$digest" = "sha256:$(tar -xOf smart-ai-bridge-candidate.tar.gz "blobs/sha256/${digest#sha256:}" | sha256sum | cut -d ' ' -f 1)"
          printf '%s\n' "$digest" > smart-ai-bridge-candidate.oci-digest
      - uses: actions/upload-artifact@v4
        with:
          name: smart-ai-bridge-0861-${{ github.sha }}
          path: |
            smart-ai-bridge-candidate.tar.gz
            smart-ai-bridge-candidate.tar.gz.sha256
            smart-ai-bridge-candidate.oci-digest
          if-no-files-found: error
          retention-days: 3
      - name: Package the isolated full app
        run: |
          mkdir -p "$RUNNER_TEMP/raytech-app"
          git archive HEAD experiments/smart-ai-server | tar -x -C "$RUNNER_TEMP/raytech-app"
          RAYTECH_OFFICIAL_SNAPSHOT="$RUNNER_TEMP/raytech-reference" node experiments/smart-ai-server/cloud-run/integration/package-full-app.mjs "$RUNNER_TEMP/raytech-app"
          cp -r "$RUNNER_TEMP/raytech-app-vendor" "$RUNNER_TEMP/raytech-app/vendor"
          runtime="$RUNNER_TEMP/raytech-app/experiments/smart-ai-server/cloud-run/integration"
          rm "$runtime/recovery-invoice.mjs" "$runtime/mount.mjs" "$runtime/lab-ui.mjs" "$runtime/index.html" "$runtime/workspace.mjs"
          (cd "$RUNNER_TEMP/raytech-app" && zip -qr "$GITHUB_WORKSPACE/raytech-smart-ai-0861.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: raytech-smart-ai-0861-${{ github.sha }}
          path: raytech-smart-ai-0861.zip
          if-no-files-found: error
