name: V33.2 Smart Cloud tests
on:
  push:
    branches: [feature/v33-2-smart-cloud]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test smart-v332/tests/*.test.mjs
      - run: find smart-v332/js -type f \\( -name '*.js' -o -name '*.mjs' \\) -print0 | xargs -0 -n1 node --check
