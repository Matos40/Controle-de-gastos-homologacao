name: Raytech CG - gate de homologacao
on:
  push:
    branches: ['feature/v34-7-4-4-production-parity', 'feature/raytech-hml-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    if: github.repository == 'Matos40/Controle-de-gastos-homologacao' && (github.ref == 'refs/heads/feature/v34-7-4-4-production-parity' || startsWith(github.ref, 'refs/heads/feature/raytech-hml-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GCLOUD_PROJECT: demo-raytech-v340
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Backend isolated dependencies
        working-directory: backend-v340/functions
        run: npm ci --no-audit --no-fund
      - name: Rules SDK isolated dependencies
        working-directory: backend-v340/workspace-v345
        run: npm ci --no-audit --no-fund
      - name: Backend unit authorization and quota regressions
        working-directory: backend-v340/functions
        run: node --test policy.test.mjs invoice.test.mjs usage.test.mjs usage-admin.test.mjs security-v347.test.mjs global-budget.test.mjs outcome.test.mjs
      - name: Candidate rules direct client negative and positive tests
        working-directory: backend-v340/workspace-v345
        run: npx --yes firebase-tools@15.35.0 emulators:exec --config security-v347.json --project demo-raytech-v340 --only firestore "node --test security-v347.test.mjs"
      - name: Backend HTTP auth, roles, quotas and real atomic transactions
        working-directory: backend-v340
        run: npx --yes firebase-tools@15.35.0 emulators:exec --project demo-raytech-v340 --only auth,firestore,functions "node --test --test-concurrency=1 functions/emulator.test.mjs"
      - name: Install Chromium for isolated dashboard
        timeout-minutes: 4
        run: |
          npm install --prefix /tmp/raytech-rc-browser --no-audit --no-fund playwright@1.56.1
          /tmp/raytech-rc-browser/node_modules/.bin/playwright install chromium
      - name: Smart Admin desktop mobile and extraction in fresh emulators
        working-directory: backend-v340
        run: npx --yes firebase-tools@15.35.0 emulators:exec --project demo-raytech-v340 --only auth,firestore,functions "node --test functions/app-ux.test.mjs"
      - name: Build isolated financial workspace
        working-directory: backend-v340/workspace-v345
        run: |
          npm run build
          node prepare-v3473.mjs
          node --test scope.test.mjs online/model.test.mjs visual-refinement.test.mjs online/google-profile.test.mjs
          node --test smart-admin-modal.test.mjs production-parity.test.mjs
      - name: Full financial workspace regressions in fresh emulators
        working-directory: backend-v340
        run: npx --yes firebase-tools@15.35.0 emulators:exec --config firebase-v3473.json --project demo-raytech-v340 --only auth,firestore,functions "cd workspace-v345 && node --test integration.test.mjs"
      - name: Validate candidate online rules syntax in emulator only
        working-directory: backend-v340/workspace-v345
        run: |
          node online/prepare-online-rules.mjs
          npx --yes firebase-tools@15.35.0 emulators:exec --config online/emulators-online.json --project demo-raytech-v340 --only firestore "node --test --test-concurrency=1 online/google-profile-rules.test.mjs online/online-rules.test.mjs"
      - name: Verify Hosting scope and prepare static publication
        working-directory: backend-v340/workspace-v345
        run: |
          node stage-hosting.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: raytech-hosting-homologacao-${{ github.sha }}
          path: backend-v340/workspace-v345/hosting-release/
          if-no-files-found: error
