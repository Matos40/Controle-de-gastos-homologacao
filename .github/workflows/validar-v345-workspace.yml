name: V34.5 Integrated Financial Workspace
on:
  push:
    branches: [feature/v34-5-integrated-financial-workspace, feature/v34-5-1-smart-interface-refinement, feature/v34-6-smart-pwa-experience]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'Matos40/Controle-de-gastos-homologacao'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve isolated dependencies
        working-directory: backend-v340/functions
        run: |
          echo 'd46084ed8e33b2b6899ca0ad6b78dc9de3e53c26e4ba145c51f9fbd4c73f82b1  package-lock.json' | sha256sum -c -
          npm ci --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - name: Dependency review (report only)
        working-directory: backend-v340/functions
        run: |
          npm outdated --json > outdated.json || true
          npm audit --omit=dev --json > audit.json || true
          node -e 'const a=require("./audit.json"); if(!a.metadata?.vulnerabilities)process.exit(1); console.log(JSON.stringify(a.metadata.vulnerabilities))'
          sha256sum package-lock.json
          node -e 'const a=require("./audit.json"); if(a.metadata.vulnerabilities.total!==0)process.exit(1)'
      - uses: actions/upload-artifact@v5
        with:
          name: v345-dependency-evidence
          path: |
            backend-v340/functions/package-lock.json
            backend-v340/functions/outdated.json
            backend-v340/functions/audit.json
      - name: Policy and invoice security tests
        working-directory: backend-v340/functions
        run: node --test policy.test.mjs invoice.test.mjs usage.test.mjs usage-admin.test.mjs
      - name: Panel syntax
        working-directory: backend-v340/functions
        run: node --check admin-panel.js && node --check admin-panel-server.mjs && node --check rc.js && node --check app-ux/app.js
      - name: Install pinned browser test tooling outside backend
        run: |
          npm install --prefix /tmp/raytech-rc-browser --no-audit --no-fund playwright@1.56.1
          /tmp/raytech-rc-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Real local emulators
        working-directory: backend-v340
        env:
          GCLOUD_PROJECT: demo-raytech-v340
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
        run: timeout 480s npx --yes firebase-tools@15.35.0 emulators:exec --project demo-raytech-v340 --only auth,firestore,functions "node --test --test-concurrency=1 functions/emulator.test.mjs functions/admin-panel.test.mjs functions/rc-browser.test.mjs functions/practical.test.mjs"
      - name: V34.4 Chromium in fresh emulators
        working-directory: backend-v340
        env:
          GCLOUD_PROJECT: demo-raytech-v340
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
        run: timeout 480s npx --yes firebase-tools@15.35.0 emulators:exec --project demo-raytech-v340 --only auth,firestore,functions "node --test functions/app-ux.test.mjs"
      - name: Existing synthetic regression tests
        if: always()
        run: node --test tests/cloud-test*.test.mjs

      - name: V34.5 isolated model and scope tests
        run: node --test backend-v340/workspace-v345/scope.test.mjs backend-v340/workspace-v345/online/model.test.mjs

      - name: Build V34.5 isolated dashboard
        working-directory: backend-v340/workspace-v345
        run: |
          npm ci --no-audit --no-fund
          npm run build
          if [ "$GITHUB_REF_NAME" != "feature/v34-5-integrated-financial-workspace" ]; then node --test visual-refinement.test.mjs; fi
          npm run prepare:emulators
          npx playwright install --with-deps chromium
      - name: V34.5 Firestore rules and dashboard Chromium
        working-directory: backend-v340/workspace-v345
        env:
          GCLOUD_PROJECT: demo-raytech-v340
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:19099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
        run: timeout 240s npx --yes firebase-tools@15.35.0 emulators:exec --config emulators.json --project demo-raytech-v340 --only auth,firestore "node --test integration.test.mjs"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ github.ref_name == 'feature/v34-6-smart-pwa-experience' && 'raytech-v346-engineering-candidate' || 'raytech-v345-hosting-candidate' }}
          path: |
            backend-v340/workspace-v345/dist
            backend-v340/workspace-v345/hosting.json
            backend-v340/workspace-v345/PWA.md
