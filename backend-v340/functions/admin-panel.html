<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raytech CG | Laboratório de consumo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#081727;color:#e2e8f0;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:1.6rem}section,article{background:#11263a;padding:16px;border:1px solid #28435a;border-radius:12px;margin:12px 0}label{display:block}input,button{font:inherit;padding:10px;border-radius:6px;margin:5px 0;max-width:100%}input{background:#081727;color:#fff;border:1px solid #64748b}button{background:#38bdf8;color:#081727;border:0;cursor:pointer}button:disabled{opacity:.5}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric{margin:0}strong{font-size:1.4rem;display:block}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}td,th{text-align:left;padding:10px;border-bottom:1px solid #28435a}#status{min-height:1.5em}form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}input[type=number]{width:100px}</style>
<main><h1>Raytech CG · Consumo de IA</h1><p>Laboratório exclusivamente local · períodos UTC · tentativas reservadas, não custos reais.</p>
<section><label for="token">Token fictício do Authentication Emulator</label><input id="token" type="password" autocomplete="off"><button id="load">Consultar</button><button id="logout">Limpar sessão</button><p id="status" role="status"></p></section>
<div class="metrics" id="metrics"></div>
<section><h2>Usuários da página</h2><label for="search">Buscar UID ou consultar diretamente</label><input id="search" maxlength="128"><button id="lookup">Consultar UID</button><div class="scroll"><table><thead><tr><th>UID</th><th>Plano</th><th>Minuto</th><th>Dia</th><th>Mês</th><th>Cota atingida</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></div><button id="next" disabled>Próxima página</button></section>
<section id="editor" hidden><h2>Configurar limites</h2><p id="target"></p><form id="form"><label>Minuto<input id="minute" type="number" min="1" max="10000" required></label><label>Dia<input id="day" type="number" min="1" max="10000" required></label><label>Mês<input id="month" type="number" min="1" max="10000" required></label><button>Salvar limites</button></form></section></main><script type="module" src="./admin-panel.js"></script></html>
